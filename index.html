<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>AFRAME — A minha primeira cena</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <!-- Caixa -->
        <a-box
            position="-2 1 -5"
            rotation="0 30 0"
            width="1.5"
            height="1.5"
            depth="1.5"
            color="#FF5733">
        </a-box>

        <!-- Esfera -->
        <a-sphere
            position="2 1.5 -5"
            radius="1.2"
            color="#9B59B6">
        </a-sphere>

        <!-- Cilindro -->
        <a-cylinder
            position="0 1 -5"
            radius="0.7"
            height="2"
            color="#F1C40F">
        </a-cylinder>

        <!-- Chão -->
        <a-plane
            position="0 0 -5"
            rotation="-90 0 0"
            width="8"
            height="8"
            color="#3498DB">
        </a-plane>

        <!-- Texto -->
        <a-text
            value="Ola, Patricia!"
            position="-2 3.5 -5"
            color="#2ECC71"
            width="7">
        </a-text>

        <!-- Céu -->
        <a-sky color="#1A1A2E"></a-sky>

    </a-scene>

</body>
</html>
