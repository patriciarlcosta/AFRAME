<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>AFRAME — A minha primeira cena</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <!-- Caixa -->
        <a-box
            position="-3 1 -6"
            rotation="25 60 15"
            width="2"
            height="2"
            depth="2"
            color="#FF5733">
        </a-box>

        <!-- Esfera -->
        <a-sphere
            position="3 2.5 -8"
            radius="1.5"
            color="#9B59B6">
        </a-sphere>

        <!-- Cilindro -->
        <a-cylinder
            position="0 1.5 -5"
            radius="0.8"
            height="3"
            rotation="0 0 20"
            color="#F1C40F">
        </a-cylinder>

        <!-- Chão -->
        <a-plane
            position="0 0 -6"
            rotation="-90 0 0"
            width="10"
            height="10"
            color="#3498DB">
        </a-plane>

        <!-- Texto -->
        <a-text
            value="Ola, Patricia!"
            position="-3 4 -6"
            rotation="0 20 0"
            color="#2ECC71"
            width="8">
        </a-text>

        <!-- Céu -->
        <a-sky color="#1A1A2E"></a-sky>

    </a-scene>

</body>
</html>
